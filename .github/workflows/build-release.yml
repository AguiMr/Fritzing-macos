name: Build & Release Fritzing (macOS)

# Builds Fritzing 1.0.7 from source on both Apple Silicon and Intel, packages
# each as a .dmg, and publishes them to a GitHub Release when a version tag is
# pushed. Manual runs (workflow_dispatch) build and upload artifacts only.
on:
  push:
    tags:
      - 'v*'            # e.g. git tag v1.0.7-1 && git push origin v1.0.7-1
  workflow_dispatch:     # run on demand from the Actions tab

permissions:
  contents: write        # needed to create the Release and upload assets

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Fritzing
        run: |
          chmod +x build_fritzing_macos.sh
          ./build_fritzing_macos.sh

      - name: Package .dmg
        run: |
          set -euo pipefail
          APP="$(find build-workspace -maxdepth 4 -name 'Fritzing.app' | head -1)"
          test -n "$APP" || { echo "Fritzing.app not found"; exit 1; }
          echo "Found app: $APP"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/Fritzing.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="Fritzing-1.0.7-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Fritzing 1.0.7" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-${{ matrix.arch }}
          path: |
            Fritzing-*.dmg
            Fritzing-*.dmg.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Fritzing-*.dmg
            dist/Fritzing-*.dmg.sha256
          fail_on_unmatched_files: true
          body: |
            Unofficial community build of **Fritzing 1.0.7** for macOS, built
            from source by this repo's CI. Two builds are attached:

            - `Fritzing-1.0.7-arm64.dmg`  — Apple Silicon (M-series)
            - `Fritzing-1.0.7-x86_64.dmg` — Intel

            Fritzing is GPLv3; this release redistributes a build of upstream
            Fritzing 1.0.7. Source build tooling is in this repository.

            ### First launch (important)
            These builds are **ad-hoc signed, not notarized** (no paid Apple
            Developer account), so Gatekeeper will block them on first open.
            After copying Fritzing to /Applications, either:

            - right-click the app → **Open** → **Open** in the dialog, or
            - run once in Terminal:
              ```
              xattr -dr com.apple.quarantine /Applications/Fritzing.app
              ```

            Verify your download against the attached `.sha256` files.
