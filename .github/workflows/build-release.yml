name: Build & Release Fritzing (macOS)

# Builds Fritzing 1.0.7 from source for Apple Silicon and Intel, packages each
# as a .dmg, and (on a version tag) attaches it to a GitHub Release.
#
# Each architecture builds and publishes INDEPENDENTLY: the fast, reliable
# arm64 build always ships, and the Intel build is best-effort — GitHub's
# macos-13 (Intel) runners are scarce and may queue a long time or be retired,
# and that must never block or delay the arm64 release.
#
# Triggers: only a maintainer pushing a tag like v1.0.7-1, or a manual run from
# the Actions tab. Nothing runs automatically.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # create the Release and upload assets

jobs:
  build:
    name: Build (${{ matrix.arch }})
    strategy:
      fail-fast: false     # one arch failing/queuing never cancels the other
      matrix:
        include:
          - runner: macos-14   # Apple Silicon
            arch: arm64
          - runner: macos-13   # Intel (best-effort; may be slow/unavailable)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Fritzing
        run: |
          chmod +x build_fritzing_macos.sh
          ./build_fritzing_macos.sh

      - name: Package .dmg
        run: |
          set -euo pipefail
          APP="$(find build-workspace -maxdepth 4 -name 'Fritzing.app' | head -1)"
          test -n "$APP" || { echo "Fritzing.app not found"; exit 1; }
          echo "Found app: $APP"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/Fritzing.app"
          ln -s /Applications "$STAGE/Applications"
          DMG="Fritzing-1.0.7-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Fritzing 1.0.7" -srcfolder "$STAGE" \
            -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | tee "$DMG.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fritzing-${{ matrix.arch }}
          path: |
            Fritzing-*.dmg
            Fritzing-*.dmg.sha256
          if-no-files-found: error

      # On a tag build, attach THIS arch's DMG to the Release for the tag.
      # softprops/action-gh-release upserts: whichever job runs first creates
      # the release, the other just adds its file. A slow/absent Intel build
      # simply means the release ships with the arm64 DMG and gains the Intel
      # one later if/when that job completes.
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Fritzing-*.dmg
            Fritzing-*.dmg.sha256
          fail_on_unmatched_files: true
          body: |
            Unofficial community build of **Fritzing 1.0.7** for macOS, built
            from source by this repository's CI.

            Downloads are attached below:
            - `Fritzing-1.0.7-arm64.dmg`  — Apple Silicon (M-series)
            - `Fritzing-1.0.7-x86_64.dmg` — Intel *(added when the Intel runner
              is available; may lag the arm64 build or be absent)*

            Fritzing is GPLv3; this release redistributes a build of upstream
            Fritzing 1.0.7. The build tooling is in this repository.

            ### First launch (important)
            These builds are **ad-hoc signed, not notarized** (no paid Apple
            Developer account), so Gatekeeper blocks them on first open. After
            copying Fritzing to /Applications, either:

            - right-click the app → **Open** → **Open** in the dialog, or
            - run once in Terminal:
              ```
              xattr -dr com.apple.quarantine /Applications/Fritzing.app
              ```

            Verify your download against the attached `.sha256` file.
